<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Northlight Advisory Services</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <link rel="canonical" href="{{ page.permalink | default: page.url | prepend: site.url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.og_title | default: page.title }}">
  <meta property="og:description" content="{{ page.og_description | default: page.description }}">
  <meta property="og:url" content="{{ page.permalink | default: page.url | prepend: site.url }}">
  <meta property="og:site_name" content="Northlight Advisory Services">
  <meta property="og:image" content="{{ site.url }}/northlight-og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.og_title | default: page.title }}">
  <meta name="twitter:description" content="{{ page.og_description | default: page.description }}">
  <meta name="twitter:image" content="{{ site.url }}/northlight-og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#0E0E1A;
      --body:#2A2D3E;
      --muted:#5A6080;
      --rule:#D4D8E8;
      --glacial:#2BA8AD;
      --dusk:#6B4FB8;
      --surface:#F4F5FA;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#fff;color:var(--ink);font-family:'Outfit',sans-serif;padding:48px 56px 64px;max-width:760px;margin:0 auto;}

    .print-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;padding-bottom:20px;border-bottom:2px solid var(--ink);}
    .wordmark{font-family:'Jost',sans-serif;font-weight:700;font-size:18px;letter-spacing:.08em;color:var(--ink);}
    .print-url{font-family:'Outfit',sans-serif;font-size:11px;color:var(--muted);}

    .doc-title{font-family:'Jost',sans-serif;font-weight:700;font-size:26px;line-height:1.1;color:var(--ink);margin-bottom:6px;}
    .doc-subtitle{font-family:'Outfit',sans-serif;font-size:14px;color:var(--muted);margin-bottom:32px;}

    .step{margin-bottom:28px;break-inside:avoid;}
    .step-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
    .step-number{font-family:'Jost',sans-serif;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--ink);border-radius:4px;padding:3px 9px;white-space:nowrap;}
    .step-title{font-family:'Jost',sans-serif;font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--ink);}
    .step-rule{height:1px;background:var(--rule);margin-bottom:10px;}

    .checklist{list-style:none;padding:0;margin:0;}
    .checklist li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--body);line-height:1.6;padding:4px 0;border-bottom:1px solid var(--rule);}
    .checklist li:last-child{border-bottom:none;}
    .check-box{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:2px;flex-shrink:0;margin-top:3px;}

    .policy-section{margin-bottom:28px;break-inside:avoid;}
    .policy-section-title{font-family:'Jost',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--ink);}
    .policy-item{font-size:13px;color:var(--body);line-height:1.7;padding:10px 0;border-bottom:1px solid var(--rule);}
    .policy-item:last-child{border-bottom:none;}
    .policy-label{font-family:'Jost',sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
    .policy-fill{display:inline-block;min-width:200px;border-bottom:1px solid var(--ink);margin-left:4px;}

    .print-footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;}
    .footer-note{font-family:'Outfit',sans-serif;font-size:11px;color:var(--muted);}
    .footer-url{font-family:'Jost',sans-serif;font-size:11px;font-weight:600;color:var(--muted);}

    .no-print-bar{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 20px;margin-bottom:32px;display:flex;justify-content:space-between;align-items:center;gap:16px;}
    .no-print-bar p{font-size:13px;color:var(--muted);}
    .no-print-bar a{font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dusk);text-decoration:none;white-space:nowrap;}
    .no-print-bar a:hover{color:var(--ink);}

    @media print{
      body{padding:24px 32px;max-width:none;}
      .no-print-bar{display:none;}
      @page{margin:20mm 18mm;}
    }
  </style>
</head>
<body>
{{ content }}
</body>
</html>
