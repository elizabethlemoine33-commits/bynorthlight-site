<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Elizabeth Lemoine — Northlight Advisory Services</title>
  <meta name=”description” content=”Elizabeth Lemoine — Founder &amp; Principal, Northlight Advisory Services. Scan to add contact.”>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://bynorthlight.ca/card.html">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer data-domain="bynorthlight.ca" src="https://plausible.io/js/script.js"></script>
  <style>
    :root {
      --midnight:   #0E0E14;
      --deep-night: #08080F;
      --surface:    #12121E;
      --surface-2:  #10101C;
      --border:     #1E2035;
      --border-2:   #2A2A48;
      --text:       #FFFFFF;
      --cloud:      #C8CCE0;
      --haze:       #BCC2DC;
      --muted:      #99A1B6;
      --glacial:    #4FC3C8;
      --boreal:     #5B8DD9;
      --dusk:       #8B6FD4;
      --aurora:     #C46FAA;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100dvh;
      background: var(--midnight);
      color: var(--cloud);
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }

    .card {
      width: 100%;
      max-width: 412px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }

    /* Aurora gradient top bar */
    .top-bar {
      height: 3px;
      background: linear-gradient(90deg, #4FC3C8 0%, #5B8DD9 30%, #8B6FD4 65%, #C46FAA 100%);
      flex-shrink: 0;
    }

    /* Ambient glow */
    .card::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 280px;
      height: 280px;
      background: radial-gradient(ellipse, rgba(91,141,217,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .card-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px 36px 44px;
      position: relative;
      z-index: 1;
    }

    /* Wordmark */
    .wordmark {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(105deg, #4FC3C8 0%, #5B8DD9 33%, #8B6FD4 66%, #C46FAA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 48px;
    }

    /* Identity block */
    .identity {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name {
      font-family: 'Jost', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .title {
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(105deg, #4FC3C8 0%, #5B8DD9 33%, #8B6FD4 66%, #C46FAA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .org {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--haze);
      margin-bottom: 32px;
    }

    .divider {
      width: 36px;
      height: 2px;
      background: linear-gradient(90deg, #4FC3C8, #8B6FD4);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 44px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .contact-icon {
      width: 32px;
      height: 32px;
      background: var(--deep-night);
      border: 1px solid var(--border-2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 14px;
      height: 14px;
      fill: var(--glacial);
    }

    .contact-text {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--haze);
      text-decoration: none;
    }

    a.contact-text:hover { color: var(--text); }

    /* QR block */
    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .qr-wrap {
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      display: inline-flex;
    }

    .qr-wrap img {
      width: 180px;
      height: 180px;
      display: block;
      border-radius: 4px;
    }

    .qr-label {
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    /* Bottom bar */
    .bottom-bar {
      height: 2px;
      background: linear-gradient(90deg, #4FC3C8 0%, #5B8DD9 30%, #8B6FD4 65%, #C46FAA 100%);
      flex-shrink: 0;
    }

    @media (min-height: 800px) {
      .card-inner { padding: 48px 40px 52px; }
      .name { font-size: 38px; }
      .qr-wrap img { width: 200px; height: 200px; }
    }
  </style>
</head>
