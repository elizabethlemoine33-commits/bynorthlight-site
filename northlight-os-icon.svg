<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b8dd9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6fd4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- OS Grid background -->
  <rect x="18" y="18" width="60" height="60" rx="8" fill="#1A1D27" opacity="0.5"/>
  <!-- Grid lines -->
  <line x1="48" y1="18" x2="48" y2="78" stroke="#C8Cce0" stroke-width="1.5" opacity="0.3"/>
  <line x1="18" y1="48" x2="78" y2="48" stroke="#C8Cce0" stroke-width="1.5" opacity="0.3"/>
  <!-- North star -->
  <circle cx="48" cy="28" r="4" fill="url(#starGradient)"/>
  <path d="M48 20 L48 36 M40 28 L56 28" stroke="url(#starGradient)" stroke-width="2" stroke-linecap="round"/>
  <!-- Corner indicators -->
  <circle cx="30" cy="30" r="2.5" fill="#5b8dd9" opacity="0.7"/>
  <circle cx="66" cy="30" r="2.5" fill="#8b6fd4" opacity="0.7"/>
  <circle cx="30" cy="66" r="2.5" fill="#4fc3c8" opacity="0.7"/>
  <circle cx="66" cy="66" r="2.5" fill="#C46FAA" opacity="0.7"/>
  <!-- OS text integrated -->
  <text x="48" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">OS</text>
</svg>
