name: Update llms.txt blog list

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'

jobs:
  update-llms:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update blog list in llms.txt
        run: python3 .github/scripts/update_llms_blog.py

      - name: Commit updated llms.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt
          git diff --staged --quiet || git commit -m "chore: sync llms.txt blog list"
          git push
