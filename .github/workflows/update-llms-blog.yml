name: Update llms.txt blog list

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'

concurrency:
  group: auto-commit
  cancel-in-progress: false

jobs:
  update-llms:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update blog list in llms.txt
        run: python3 .github/scripts/update_llms_blog.py

      - name: Commit updated llms.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt
          if git diff --staged --quiet; then
            echo "llms.txt unchanged — nothing to commit"
          else
            git pull --rebase origin main
            git commit -m "chore: sync llms.txt blog list"
            git push
          fi
