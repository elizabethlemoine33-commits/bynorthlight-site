name: Auto-publish scheduled posts

on:
  schedule:
    - cron: '0 13 * * *'  # Daily at 1pm UTC (9am Eastern)
  workflow_dispatch:       # Run manually from Actions tab if needed

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish due posts
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          CHANGED=0

          for file in blog/*.md; do
            if grep -q "^published: false" "$file"; then
              POST_DATE=$(grep "^date:" "$file" | head -1 | sed 's/date: //' | tr -d '"' | cut -c1-10)
              if [ -n "$POST_DATE" ] && [[ "$POST_DATE" <= "$TODAY" ]]; then
                echo "Publishing: $file (scheduled: $POST_DATE)"
                sed -i '/^published: false$/d' "$file"
                CHANGED=1
              fi
            fi
          done

          if [ "$CHANGED" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blog/*.md
            git commit -m "Auto-publish posts scheduled for $TODAY"
            git push
          else
            echo "No posts due today."
          fi
